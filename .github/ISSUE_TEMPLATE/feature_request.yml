name: Feature request
description: An idea to make Beacyn Chess better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would help you?
      description: Describe the problem or wish, e.g. "I keep missing forks and want…"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could it work? Sketches and screenshots welcome.
  - type: dropdown
    id: level
    attributes:
      label: Your level (roughly)
      options:
        - Just learning the rules
        - Beginner (under ~1000)
        - Improving (~1000–1500)
        - Club player (1500+)
  - type: checkboxes
    id: principles
    attributes:
      label: Fits the project
      options:
        - label: It can work without a server, an account or a paid service
