name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please don't include personal data. For security problems, use the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a game as White
        2. Play e4 …
    validations:
      required: true
  - type: textarea
    id: position
    attributes:
      label: Position or game (if it's about chess)
      description: A FEN, or the PGN (Copy PGN after a game). Wrong coaching advice is a bug too!
      render: text
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Pixel 7, Chrome 140 / iPhone 15, Safari 18 / Windows, Firefox 141
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
